<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meu Financeiro">
    <title>Modo Offline | Meu Financeiro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style1.css">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 50% 20%, #171d33, #0d131f 85%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
        }

        .offline-card {
            background: rgba(26, 31, 53, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px 28px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(124, 93, 250, 0.15);
        }

        .offline-brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(124, 93, 250, 0.15);
            border: 1px solid rgba(124, 93, 250, 0.3);
            color: #c4b5fd;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 24px;
        }

        .offline-icon-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(124, 93, 250, 0.12);
            border: 1px solid rgba(124, 93, 250, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin: 0 auto 20px;
            box-shadow: 0 0 24px rgba(124, 93, 250, 0.25);
        }

        .offline-title {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 10px;
            color: #ffffff;
        }

        .offline-desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin: 0 0 24px;
        }

        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .offline-btn-retry {
            background: #7c5dfa;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(124, 93, 250, 0.4);
        }

        .offline-btn-retry:hover {
            background: #6c4af5;
            transform: translateY(-1px);
        }

        .offline-cached-links {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 18px;
        }

        .offline-links-title {
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .offline-nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .offline-nav-link {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .offline-nav-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(124, 93, 250, 0.3);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-brand-badge">
            <span>⚡</span>
            <span>Meu Financeiro Local-First</span>
        </div>

        <div class="offline-icon-circle">
            <span>📡</span>
        </div>

        <h1 class="offline-title">Você está offline</h1>
        <p class="offline-desc">
            Não há conexão de internet ativa no momento. Todas as suas finanças salvas neste aparelho continuam seguras e acessíveis!
        </p>

        <div class="offline-actions">
            <button type="button" class="offline-btn-retry" id="btnRetryConnection">
                <span>🔄</span>
                <span>Tentar Reconectar</span>
            </button>
        </div>

        <div class="offline-cached-links">
            <div class="offline-links-title">Páginas Disponíveis Offline</div>
            <div class="offline-nav-grid">
                <a href="index.html" class="offline-nav-link">📊 Visão Geral</a>
                <a href="lancamentos.html" class="offline-nav-link">➕ Lançamentos</a>
                <a href="contas-fixas.html" class="offline-nav-link">🔄 Contas Fixas</a>
                <a href="agenda.html" class="offline-nav-link">📅 Agenda</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("btnRetryConnection").addEventListener("click", () => {
            window.location.reload();
        });

        // Se a internet voltar, recarrega a página automaticamente
        window.addEventListener("online", () => {
            window.location.reload();
        });
    </script>
</body>
</html>
